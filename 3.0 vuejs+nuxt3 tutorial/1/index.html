<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learnin vue js</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .box {
            padding: 10px 0;
            width: 160px;
            text-align: center;
            background-color: #ddd;
            margin: 20px;
            display: inline-block;

        }
        body{
            background-color: #eee;
            max-width: 960px;
            margin: 20px auto;
        }
        p, h3 ,ul{
            margin:0;
            padding : 0;
        }
        li{
            list-style-type: none;
            background: #fff;
            margin: 20px auto;
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        li.fav{
            background: pink;
            color: white;
        }
    </style>
</head>

<body>
    <h1> hello vue </h1>
    <div id="app">
        <!-- atttribute binding -->
        <a :href = "url"> best website ever</a>
        <div v-if="showBooks">
           <ul>
                <p>fav Books:</p>
                <li v-for="book in filteredBooks" :class="{fav:book.isFav}" @click="toggleFav(book)" title="click to add/remove me from favorites ">
                    <img :src="book.img" :alt="book.title">
                    <h3> {{book.title}}</h3>
                    <p>{{book.author}}</p>                  
                </li>
                <p v-show="notFavBooks.length > 0 ">rest of Books:</p>
                <li v-for="book in notFavBooks" :class="{fav:book.isFav}" @click="toggleFav(book)" title="click to add/remove me from favorites ">
                    <img :src="book.img" :alt="book.title">
                    <h3> {{book.title}}</h3>
                    <p>{{book.author}}</p>                  
                </li>
                <!--
                    <li v-for="book in books" :class="{fav:book.isFav}">
                    <img :src="book.img" :alt="book.title">
                    <h3> {{book.title}}</h3>
                    <p>{{book.author}}</p>
                    <button @click="book.isFav= !book.isFav">favorite</button>
                </li>
                -->
           </ul>
  
            <!--
                 <p>{{title }} - {{author}} - {{age}}</p>
                <button @click="age++"> increase age</button>
            <button v-on:click="age--"> decrease age</button>
            <div @click="changeTitle('oath bringer')"> change book title</div>
         -->
        </div>
        <hr>
        <!--
        <button @click="showBooks=!showBooks">
           toggle books
        </button>
       -->
        <div v-show="showBooks">currently showing books</div>
        <button @click="toggleBooks()">
            <span v-if="showBooks">hide books</span>
            <span v-else>show books</span>
        </button>

        <br>
        <!-- mouse events-->
        <div class="box" @mouseover="handleEvent($event,'5')"> mouse over(enter)</div>
        <div class="box"  @mouseleave="handleEvent">mouse leave</div>
        <div class="box" @dblclick="handleEvent">double click</div>
        <div class="box" @mousemove = handleMouseMove>mouse Move <br>
           position - x: {{x}} , y: {{y}}
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
